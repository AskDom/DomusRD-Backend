name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: domify
          POSTGRES_PASSWORD: domify_dev_password
          POSTGRES_DB: domify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://domify:domify_dev_password@localhost:5432/domify_test?schema=public
      JWT_SECRET: ci-test-secret-no-usar-en-produccion
      JWT_EXPIRES_IN: 7d
      NODE_ENV: test
      FRONTEND_URL: http://localhost:3000
      AUTH_RATE_LIMIT_MAX: 1000
      RESEND_API_KEY: ""
      SENTRY_DSN: ""
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Aplicar migraciones a la DB de test
        run: npx prisma migrate deploy

      - name: Correr tests
        run: npx jest --runInBand
